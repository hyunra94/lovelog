<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1.0">
  <title>LOVE LOG 🌸</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#FF85A2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="LOVE LOG">
  <link rel="icon" href="https://hyunra94.github.io/assets/favicon.png">
  <link rel="apple-touch-icon" href="https://hyunra94.github.io/assets/favicon.png">
  <meta property="og:title" content="LOVE LOG">
  <meta property="og:image" content="https://hyunra94.github.io/assets/og-default.png">
  <meta property="og:url" content="https://hyunra94.github.io/lovelog/">
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:   #FFF0F5;
  --pink: #FF85A2;
  --pk2:  #FFB7C5;
  --text: #2A1A22;
  --mute: #A090A0;
  --bdr:  #FFD6E7;
  --hh:   54px;
  --nh:   62px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans KR',sans-serif;background:#fff;color:var(--text);overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;}

/* ── 헤더 ─────────────────────── */
.hdr{position:fixed;top:0;left:0;right:0;height:var(--hh);background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--bdr);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:100;}
.logo{font-family:'Permanent Marker',cursive;font-size:22px;color:var(--pink);letter-spacing:1px;}
.hbtn{width:38px;height:38px;border:none;background:none;cursor:pointer;font-size:22px;color:var(--text);display:flex;align-items:center;justify-content:center;border-radius:50%;transition:background .15s;}
.hbtn:active{background:var(--bg);}

/* ── 본문 ─────────────────────── */
.main{padding-top:var(--hh);padding-bottom:calc(var(--nh) + env(safe-area-inset-bottom));min-height:100vh;}

/* ── 프로필 ───────────────────── */
.prof{display:flex;align-items:center;gap:16px;padding:18px 16px 14px;background:white;}
.av-wrap{position:relative;flex-shrink:0;}
.av-ring{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#FF85A2,#FFB7C5);padding:2.5px;cursor:pointer;}
.av-inner{width:100%;height:100%;border-radius:50%;overflow:hidden;background:#FFF0F5;display:flex;align-items:center;justify-content:center;border:2px solid white;font-size:30px;}
.av-inner img{width:100%;height:100%;object-fit:cover;}
.av-plus{position:absolute;bottom:0;right:0;width:24px;height:24px;background:var(--pink);border:2.5px solid white;border-radius:50%;font-size:14px;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;}
.prof-mid{flex:1;min-width:0;}
.prof-name{font-size:16px;font-weight:700;}
.prof-msg{font-size:13px;color:var(--mute);margin-top:3px;word-break:break-all;}
.dday-box{flex-shrink:0;text-align:center;padding:8px 12px;background:var(--bg);border-radius:14px;}
.dday-num{font-family:'Permanent Marker',cursive;font-size:30px;color:var(--pink);line-height:1;}
.dday-unit{font-size:13px;color:var(--pink);font-weight:700;}
.dday-sub{font-size:11px;color:var(--mute);margin-top:2px;}

/* ── 컨텐츠 탭 ────────────────── */
.ctabs{display:flex;border-top:1px solid #F0F0F0;border-bottom:1px solid #F0F0F0;position:sticky;top:var(--hh);z-index:50;background:white;}
.ctab{flex:1;height:44px;border:none;background:none;cursor:pointer;font-size:19px;color:var(--mute);border-bottom:2.5px solid transparent;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.ctab.on{color:var(--text);border-bottom-color:var(--text);}

/* ── 그리드 ───────────────────── */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#EBEBEB;}
.gcell{cursor:pointer;background:white;overflow:hidden;display:flex;flex-direction:column;}
.gcell-img{aspect-ratio:1;overflow:hidden;position:relative;background:var(--bg);flex-shrink:0;}
.gcell-img img{width:100%;height:100%;object-fit:cover;display:block;}
.gcell-img .noimg{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;}
.noimg-ico{font-size:22px;}
.gcell-txt{padding:5px 6px 7px;min-width:0;}
.gcell-date{font-size:9px;color:var(--mute);}
.gcell-day{font-size:11px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;color:var(--text);}
.gcell-memo{font-size:10px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px;}

/* ── 바텀 네비 ────────────────── */
.bnav{position:fixed;bottom:0;left:0;right:0;height:var(--nh);background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-top:1px solid #F0F0F0;display:flex;align-items:center;padding-bottom:env(safe-area-inset-bottom);z-index:100;}
.nb{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:none;background:none;cursor:pointer;color:#999;position:relative;transition:color .2s;font-size:10px;font-weight:500;}
.nb.on{color:var(--pink);}
.nb svg{width:22px;height:22px;fill:currentColor;}
.nb-lbl{font-size:10px;}

/* ── 캘린더 뷰 ────────────────── */
.cal-view{display:none;padding-bottom:16px;}
.cal-view.on{display:block;}
.cal-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 8px;}
.cal-title{font-size:16px;font-weight:700;}
.cal-nav-btn{width:34px;height:34px;border:none;background:var(--bg);border-radius:50%;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;color:var(--text);}
.cal-dows{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px;}
.cal-dow{text-align:center;font-size:10px;font-weight:600;color:var(--mute);padding:4px 0;}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px;gap:2px;}
.cal-day{aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;border-radius:10px;font-size:13px;transition:background .15s;}
.cal-day:empty{pointer-events:none;}
.cal-day .dn{line-height:1;}
.cal-day .dot{width:5px;height:5px;border-radius:50%;background:var(--pink);flex-shrink:0;}
.cal-day.today{font-weight:700;color:var(--pink);}
.cal-day.has{background:#FFF0F5;}
.cal-day.has .dot{display:block;}
.cal-day .dot{display:none;}
.cal-day.sel{background:var(--pink);color:white;}
.cal-day.sel .dot{background:rgba(255,255,255,.8);}
.cal-entries-wrap{padding:12px 14px 0;}
.cal-entry{background:white;border-radius:12px;padding:11px 13px;margin-bottom:8px;box-shadow:0 2px 10px rgba(255,133,162,.1);display:flex;gap:10px;cursor:pointer;align-items:center;}
.cal-entry-thumb{width:46px;height:46px;border-radius:8px;flex-shrink:0;object-fit:cover;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;overflow:hidden;}
.cal-entry-thumb img{width:100%;height:100%;object-fit:cover;}
.cal-entry-info{flex:1;min-width:0;}
.cal-entry-day{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cal-entry-memo{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
.cal-entry-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;}
.cal-entry-tag{font-size:10px;padding:2px 7px;background:var(--bg);color:var(--pink);border-radius:99px;}
.cal-empty{text-align:center;padding:30px;color:var(--mute);font-size:13px;}

/* ══ SHEETS ═══════════════════════════ */
.s-ov{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:200;pointer-events:none;transition:background .3s;}
.s-ov.on{background:rgba(0,0,0,.45);pointer-events:all;}
.sheet{position:fixed;left:0;right:0;bottom:0;background:white;border-radius:22px 22px 0 0;z-index:201;transform:translateY(105%);transition:transform .36s cubic-bezier(.4,0,.2,1);max-height:94vh;display:flex;flex-direction:column;}
.sheet.on{transform:translateY(0);}
.sh-hdl{width:36px;height:4px;background:#DDD;border-radius:2px;margin:12px auto 0;flex-shrink:0;}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 12px;border-bottom:1px solid #F5F5F5;flex-shrink:0;}
.sh-title{font-size:15px;font-weight:700;}
.sh-close{width:30px;height:30px;border:none;background:#F5F5F5;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.sh-body{overflow-y:auto;padding:14px 16px;padding-bottom:calc(env(safe-area-inset-bottom) + 20px);flex:1;}

/* ── 입력 폼 ──────────────────── */
.fc{margin-bottom:12px;}
.fl{font-size:11px;font-weight:600;color:var(--mute);letter-spacing:.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
.fl small{font-weight:400;color:var(--pink);font-size:10px;}
.fi,.fa,.fd{width:100%;padding:11px 14px;border:1.5px solid var(--bdr);border-radius:10px;font-size:15px;font-family:inherit;color:var(--text);background:var(--bg);}
.fa{resize:none;}
.fi:focus,.fa:focus,.fd:focus{outline:none;border-color:var(--pink);}
.fi::placeholder,.fa::placeholder{color:var(--mute);}

/* 매칭 배지 */
.mbdg{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:10px;font-size:13px;margin-top:8px;}
.mbdg.hit{background:#FFF0F5;color:#FF85A2;border:1px solid #FFD6E7;}
.mbdg.miss{background:#F7F7F7;color:#AAA;border:1px solid #E8E8E8;}
.mdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.mbdg.hit .mdot{background:#FF85A2;}
.mbdg.miss .mdot{background:#CCC;}

/* 중복 경고 */
.dw{margin-top:8px;border-radius:10px;overflow:hidden;border:1px solid #FFE082;}
.dw-hd{background:#FFF8E1;padding:8px 12px;font-size:12px;color:#E65100;}
.dw-it{display:flex;align-items:center;gap:10px;padding:8px 12px;background:white;border-top:1px solid #FFF3CD;}
.dw-th{width:36px;height:36px;border-radius:7px;flex-shrink:0;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center;}
.dw-th img{width:100%;height:100%;object-fit:cover;}
.dw-info{flex:1;min-width:0;}
.dw-day{font-size:13px;font-weight:600;}
.dw-memo{font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* 미디어 */
.mstrip{display:flex;gap:8px;overflow-x:auto;height:80px;padding-bottom:2px;scrollbar-width:none;align-items:center;flex-shrink:0;}
.mstrip::-webkit-scrollbar{display:none;}
.mi{position:relative;flex-shrink:0;width:76px;height:76px;max-height:76px;border-radius:10px;overflow:hidden;cursor:pointer;transition:transform .15s;}
.mi:active{transform:scale(.95);}
.mi.main{outline:3px solid var(--pink);background:#111;}
.mi img,.mi video{width:100%;height:100%;object-fit:cover;display:block;}
.mi.main img{object-fit:contain;}
.mi-mb{position:absolute;top:3px;left:3px;background:var(--pink);color:#fff;font-size:9px;font-weight:700;padding:1px 6px;border-radius:99px;}
.mi-vb{position:absolute;bottom:3px;right:3px;background:rgba(0,0,0,.5);color:#fff;width:18px;height:18px;border-radius:50%;font-size:9px;display:flex;align-items:center;justify-content:center;}
.mi-rm{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.5);color:#fff;border:none;border-radius:50%;width:19px;height:19px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.madd{flex-shrink:0;width:76px;height:76px;border:2px dashed var(--bdr);border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--mute);cursor:pointer;font-size:11px;gap:2px;background:white;}
.madd .pl{font-size:22px;color:var(--pk2);}

/* 메모 2단 필드 */
.memo-ttl{border-radius:10px 10px 0 0;border-bottom:1px solid var(--bdr);font-weight:700;font-size:15px;}
.memo-bdy{border-radius:0 0 10px 10px;border-top:none;margin-top:0;}
.memo-ttl:focus{outline:none;border-color:var(--pink);border-bottom-color:var(--bdr);}
.memo-bdy:focus{outline:none;border-color:var(--pink);border-top-color:transparent;}
.chips{display:flex;flex-wrap:wrap;gap:7px;}
.chip{padding:6px 13px;border-radius:99px;font-size:13px;cursor:pointer;border:1.5px solid var(--bdr);background:white;color:var(--text);transition:all .18s;}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff;}
.chkr{display:flex;align-items:center;gap:10px;cursor:pointer;}
.chkr input{width:18px;height:18px;accent-color:var(--pink);cursor:pointer;}

/* 등록 버튼 */
.subbtn{width:100%;padding:15px;background:linear-gradient(135deg,#FF9DB5,#FF6B90);color:#fff;border:none;border-radius:14px;font-size:16px;font-weight:700;font-family:inherit;letter-spacing:1px;cursor:pointer;box-shadow:0 5px 18px rgba(255,107,144,.35);transition:transform .1s;margin-top:10px;}
.subbtn:active{transform:scale(.98);}
.subbtn:disabled{background:#DDD;box-shadow:none;cursor:not-allowed;}

/* ── 설정 시트 ────────────────── */
.sset{padding:14px 0;border-bottom:1px solid #F8F8F8;}
.sset:last-child{border-bottom:none;}
.sset>label{font-size:11px;font-weight:600;color:var(--mute);display:block;margin-bottom:8px;letter-spacing:.5px;}
.sset input{width:100%;padding:10px 14px;border:1.5px solid var(--bdr);border-radius:10px;font-size:15px;font-family:inherit;color:var(--text);background:var(--bg);}
.sset input:focus{outline:none;border-color:var(--pink);}
.av-row{display:flex;align-items:center;gap:14px;}
.av-prev{width:56px;height:56px;border-radius:50%;background:var(--bg);overflow:hidden;border:2px solid var(--bdr);display:flex;align-items:center;justify-content:center;font-size:22px;}
.av-prev img{width:100%;height:100%;object-fit:cover;}
.av-chg{padding:8px 16px;border:1.5px solid var(--bdr);border-radius:99px;background:white;font-size:13px;cursor:pointer;font-family:inherit;}
.savebtn{width:100%;padding:13px;background:var(--pink);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:16px;}

/* ── 필터 시트 ────────────────── */
.fchips{display:flex;flex-wrap:wrap;gap:8px;padding:4px 0 8px;}
.fchip{padding:7px 14px;border-radius:99px;font-size:13px;cursor:pointer;border:1.5px solid var(--bdr);background:white;color:var(--text);transition:all .2s;}
.fchip.on{background:var(--pink);border-color:var(--pink);color:#fff;}
.fapply{width:100%;padding:13px;background:var(--pink);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;margin-top:12px;}

/* ── 디테일 모달 ──────────────── */
.det-ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:300;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .25s;}
.det-ov.on{opacity:1;pointer-events:all;}
.det-modal{background:white;border-radius:20px 20px 0 0;width:100%;max-height:90vh;overflow:hidden;transform:translateY(30px);transition:transform .3s;display:flex;flex-direction:column;}
.det-ov.on .det-modal{transform:translateY(0);}
/* 갤러리 */
.det-gallery{width:100%;aspect-ratio:1;flex-shrink:0;background:#111;position:relative;overflow:hidden;}
.det-gallery-scroll{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;}
.det-gallery-scroll::-webkit-scrollbar{display:none;}
.det-gallery-slide{width:100%;height:100%;flex-shrink:0;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#111;}
.det-gallery-slide img,.det-gallery-slide video{max-width:100%;max-height:100%;object-fit:contain;}
.det-gallery-slide .no-media{font-size:50px;}
.det-dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:5px;z-index:2;}
.det-dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.5);}
.det-dot.on{background:white;}
.det-close{position:absolute;top:10px;right:10px;width:30px;height:30px;background:rgba(0,0,0,.5);color:white;border:none;border-radius:50%;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3;}
/* 바디 */
.det-body{padding:14px 18px;overflow-y:auto;flex:1;}
.det-meta{font-size:12px;color:var(--mute);margin-bottom:4px;}
.det-day{font-size:17px;font-weight:700;margin-bottom:6px;}
.det-memo{font-size:14px;line-height:1.6;color:var(--text);}
.det-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;}
.det-tag{font-size:11px;padding:3px 10px;background:var(--bg);color:var(--pink);border-radius:99px;}
.det-edit-btn{width:100%;margin-top:14px;padding:11px;border:1.5px solid var(--bdr);border-radius:12px;background:white;font-family:inherit;font-size:14px;color:var(--text);cursor:pointer;}
/* 수정 폼 */
.det-edit-form{display:none;padding:14px 18px;overflow-y:auto;flex:1;}
.det-edit-form.on{display:block;}
.det-body.hidden{display:none;}
.det-edit-row{margin-bottom:12px;}
.det-edit-row label{font-size:11px;font-weight:600;color:var(--mute);display:block;margin-bottom:6px;}
.det-edit-row input,.det-edit-row textarea{width:100%;padding:10px 13px;border:1.5px solid var(--bdr);border-radius:10px;font-size:14px;font-family:inherit;color:var(--text);background:var(--bg);resize:none;}
.det-edit-row input:focus,.det-edit-row textarea:focus{outline:none;border-color:var(--pink);}
.det-edit-actions{display:flex;gap:10px;margin-top:16px;}
.det-cancel-btn{flex:1;padding:12px;border:1.5px solid var(--bdr);border-radius:12px;background:white;font-family:inherit;font-size:14px;cursor:pointer;}
.det-save-btn{flex:2;padding:12px;background:var(--pink);color:white;border:none;border-radius:12px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;}

/* ⋯ 더보기 메뉴 */
.det-more{position:absolute;top:10px;right:48px;width:30px;height:30px;background:rgba(0,0,0,.5);color:white;border:none;border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:3;letter-spacing:-1px;}
.det-more-menu{position:absolute;top:46px;right:10px;background:white;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.25);z-index:10;overflow:hidden;display:none;min-width:130px;}
.det-more-menu.on{display:block;}
.det-more-menu button{width:100%;padding:13px 16px;border:none;background:none;font-family:inherit;font-size:14px;text-align:left;cursor:pointer;display:flex;align-items:center;gap:10px;}
.det-more-menu button:hover{background:#F9F9F9;}
.det-more-menu .del-btn{color:#E53935;}
.det-more-menu hr{border:none;border-top:1px solid #F0F0F0;margin:0;}
/* 슬라이드 확대 버튼 */
.slide-expand{position:absolute;bottom:8px;right:8px;width:28px;height:28px;background:rgba(0,0,0,.5);color:white;border:none;border-radius:6px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;}
/* 풀스크린 뷰어 */
.img-viewer{position:fixed;inset:0;background:#000;z-index:1000;display:none;flex-direction:column;}
.img-viewer.on{display:flex;}
.img-viewer-top{position:absolute;top:0;left:0;right:0;height:52px;display:flex;align-items:center;justify-content:flex-end;padding:0 16px;z-index:2;}
.img-viewer-close{width:34px;height:34px;background:rgba(255,255,255,.15);border:none;border-radius:50%;color:white;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.img-viewer-wrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;touch-action:none;}
.img-viewer-img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;will-change:transform;user-select:none;pointer-events:none;}
.img-viewer-hint{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.5);font-size:12px;pointer-events:none;}
/* 대표사진 선택 (수정 모드) */
.cover-select-row{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;}
.cover-select-row::-webkit-scrollbar{display:none;}
.cover-thumb{width:60px;height:60px;border-radius:8px;overflow:hidden;flex-shrink:0;cursor:pointer;border:2.5px solid transparent;position:relative;}
.cover-thumb img{width:100%;height:100%;object-fit:cover;}
.cover-thumb.selected{border-color:var(--pink);}
.cover-thumb.selected::after{content:'✓';position:absolute;inset:0;background:rgba(255,133,162,.4);color:white;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;}
.loading{position:fixed;inset:0;background:rgba(255,240,245,.92);backdrop-filter:blur(4px);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:500;gap:12px;}
.loading.on{display:flex;}
.spinner{width:42px;height:42px;border:3px solid var(--bdr);border-top-color:var(--pink);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-msg{font-size:14px;color:var(--pink);font-weight:500;}
.prog-bar{width:180px;height:4px;background:var(--bdr);border-radius:2px;overflow:hidden;}
.prog-fill{height:100%;background:var(--pink);border-radius:2px;transition:width .3s;width:0;}
.toast{position:fixed;bottom:calc(var(--nh)+16px);left:50%;transform:translateX(-50%) translateY(12px);background:rgba(40,25,35,.9);color:#fff;padding:11px 20px;border-radius:99px;font-size:13px;z-index:600;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;max-width:88vw;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
/* ── 로그인 화면 ──────────────── */
.login-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;}
.login-box{background:white;border-radius:24px;padding:36px 28px;width:88%;max-width:340px;text-align:center;box-shadow:0 8px 32px rgba(255,133,162,.2);}
.login-logo{font-size:48px;margin-bottom:8px;}
.login-title{font-family:'Permanent Marker',cursive;font-size:26px;color:var(--pink);letter-spacing:2px;margin-bottom:6px;}
.login-sub{font-size:13px;color:var(--mute);margin-bottom:20px;}
.login-input{width:100%;padding:12px 16px;border:1.5px solid var(--bdr);border-radius:12px;font-size:16px;font-family:inherit;text-align:center;letter-spacing:4px;color:var(--text);background:var(--bg);outline:none;margin-bottom:10px;}
.login-input:focus{border-color:var(--pink);}
.login-err{font-size:12px;color:#E53935;margin-bottom:10px;padding:8px;background:#FFEBEE;border-radius:8px;}
.login-btn{width:100%;padding:14px;background:linear-gradient(135deg,#FF9DB5,#FF6B90);color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;box-shadow:0 4px 14px rgba(255,107,144,.35);}
.edit-add-media-btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border:1.5px dashed var(--bdr);border-radius:10px;font-size:13px;color:var(--pink);cursor:pointer;background:var(--bg);margin-top:6px;}
</style>

<script>
let WORKER = localStorage.getItem('ll_worker') || 'https://lovelog.hyunra94.workers.dev';
let SECRET  = localStorage.getItem('ll_secret') || '';
const SHARE_CACHE = 'love-log-share-v1';

let mediaItems=[],selCat=null,selTags=[],allTags=[],activeFTags=[],lovelogId=null;
let titleProp='이름',checkboxProp='체크',nextCursor=null,allEntries=[],ctabMode='all';
let dateTimer=null;

document.addEventListener('DOMContentLoaded', async()=>{
  if('serviceWorker' in navigator)
    navigator.serviceWorker.register('/lovelog/sw.js',{scope:'/lovelog/'}).catch(()=>{});

  // 비밀번호 없으면 로그인 화면 먼저
  if(!SECRET){ showLoginScreen(); return; }

  initApp();
});

async function initApp(){
  loadProfile();
  const today=new Date().toISOString().split('T')[0];
  document.getElementById('date-input').value=today;
  document.getElementById('date-input').addEventListener('change',onDateChange);
  document.getElementById('file-input').addEventListener('change',onFileSelect);
  document.getElementById('edit-file-input')?.addEventListener('change',onEditFileSelect);

  const p=new URLSearchParams(location.search);
  if(p.get('shared')){
    await loadSharedFiles();
    history.replaceState({},'','/lovelog/');
    openWrite();
  }

  loadOptions();
  loadGrid(true);
  renderStrip();
}

// ── 프로필 ─────────────────────────────────────────────
function loadProfile(){
  const name =localStorage.getItem('ll_name') ||'이름';
  const msg  =localStorage.getItem('ll_msg')  ||'입력하고 싶은 말 ✨';
  const anniv=localStorage.getItem('ll_anniv')||'';
  const av   =localStorage.getItem('ll_avatar')||'';
  document.getElementById('prof-name').textContent=name;
  document.getElementById('prof-msg').textContent=msg;
  if(anniv){
    const d=Math.floor((Date.now()-new Date(anniv))/86400000)+1;
    document.getElementById('dday-num').textContent=String(d);
  }
  if(av) setAvAll(av);
}
function setAvAll(src){
  ['av-el','nav-av','set-av-prev'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.innerHTML=`<img src="${src}" alt="">`;
  });
}
function onAvatarChange(e){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=ev=>{localStorage.setItem('ll_avatar',ev.target.result);setAvAll(ev.target.result);};
  r.readAsDataURL(f);
}
function openSettings(){
  document.getElementById('set-name').value =localStorage.getItem('ll_name') ||'';
  document.getElementById('set-msg').value  =localStorage.getItem('ll_msg')  ||'';
  document.getElementById('set-anniv').value=localStorage.getItem('ll_anniv')||'';
  const sw=document.getElementById('set-worker'); if(sw) sw.value=localStorage.getItem('ll_worker')||'';
  const st=document.getElementById('worker-status'); if(st) st.style.display='none';
  const av=localStorage.getItem('ll_avatar');
  if(av) document.getElementById('set-av-prev').innerHTML=`<img src="${av}" alt="">`;
  showSheet('set-ov','set-sh');
}
function closeSettings(){hideSheet('set-ov','set-sh');}
function saveSettings(){
  const n=document.getElementById('set-name').value.trim();
  const m=document.getElementById('set-msg').value.trim();
  const a=document.getElementById('set-anniv').value;
  const w=document.getElementById('set-worker').value.trim().replace(/\/$/,'');
  if(n) localStorage.setItem('ll_name',n);
  if(m) localStorage.setItem('ll_msg',m);
  if(a) localStorage.setItem('ll_anniv',a);
  if(w){ localStorage.setItem('ll_worker',w); WORKER=w; }
  loadProfile(); closeSettings(); showToast('✓ 설정 저장됨');
  if(w) { loadOptions(); loadGrid(true); }
}

const CACHE_KEY='ll_entries_v2';

// ── 캐시 헬퍼 ──────────────────────────────────────────
function readCache(){
  try{
    const raw=localStorage.getItem(CACHE_KEY);
    if(!raw) return null;
    const d=JSON.parse(raw);
    // 24시간 유효
    if(Date.now()-d.ts>86400000) return null;
    return d;
  }catch{return null;}
}
function writeCache(entries,hasMore,cursor){
  try{
    localStorage.setItem(CACHE_KEY,JSON.stringify({entries,hasMore,cursor,ts:Date.now()}));
  }catch{} // 용량 초과 무시
}
function clearCache(){ try{localStorage.removeItem(CACHE_KEY);}catch{} }

// ── 그리드 ─────────────────────────────────────────────
async function loadGrid(reset=false){
  const grid=document.getElementById('photo-grid');
  if(reset){
    nextCursor=null; allEntries=[];
    const cached=readCache();
    if(cached&&cached.entries.length){
      allEntries=cached.entries;
      renderGrid(allEntries);
      document.getElementById('lm-wrap').style.display=cached.hasMore?'block':'none';
    } else {
      grid.innerHTML='<div style="grid-column:1/-1;padding:30px;text-align:center;color:var(--mute);font-size:13px">🌸 불러오는 중...</div>';
    }
  }

  try{
    // lazy=1로 즉시 목록 로드 (썸네일 없이)
    const q=(nextCursor?`/entries?cursor=${nextCursor}&lazy=1`:'/entries?lazy=1');
    const res=await api(q);
    if(reset){
      allEntries=res.entries;
    } else {
      allEntries=[...allEntries,...res.entries];
    }
    allEntries.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
    renderGrid(allEntries);
    writeCache(allEntries,res.hasMore,res.nextCursor);
    nextCursor=res.nextCursor;
    document.getElementById('lm-wrap').style.display=res.hasMore?'block':'none';
    if(allEntries.length===0)
      grid.innerHTML='<div style="grid-column:1/-1;padding:50px 20px;text-align:center;color:var(--mute);font-size:13px;line-height:2">💕<br>아직 기록이 없어요<br>+ 버튼으로 첫 데이트를 기록해봐요!</div>';

    if(currentView==='cal') renderCalendar();

    // 백그라운드에서 썸네일 지연 로딩
    loadThumbnailsLazy(res.entries);
  }catch(e){
    if(allEntries.length===0)
      grid.innerHTML='<div style="grid-column:1/-1;padding:30px;text-align:center;color:var(--mute)">⚠️ 불러오기 실패</div>';
  }
}

// 썸네일 지연 로딩 — 커버 없는 항목 순차 처리
async function loadThumbnailsLazy(entries){
  const noThumb=entries.filter(e=>!e.cover);
  for(const entry of noThumb){
    try{
      const res=await api(`/page-blocks?id=${entry.id}`);
      if(res.media?.[0]?.url){
        const url=res.media[0].url;
        entry.cover=url;
        const idx=allEntries.findIndex(x=>x.id===entry.id);
        if(idx!==-1) allEntries[idx].cover=url;
        // 해당 셀 썸네일만 업데이트
        const cell=document.querySelector(`.gcell[data-id="${entry.id}"] .gcell-img`);
        if(cell){
          cell.innerHTML=`<img src="${url}" alt="" loading="lazy">`;
        }
      }
    }catch{}
    // 과부하 방지 딜레이
    await new Promise(r=>setTimeout(r,80));
  }
}
function renderGrid(entries){
  const grid=document.getElementById('photo-grid');
  grid.innerHTML='';
  let shown=ctabMode==='video'
    ?entries.filter(e=>e.cover&&/\.(mp4|mov|webm|avi)/i.test(e.cover))
    :entries;
  if(activeFTags.length) shown=shown.filter(e=>activeFTags.every(t=>e.tags?.includes(t)));

  shown.forEach(entry=>{
    const c=document.createElement('div'); c.className='gcell';
    c.dataset.id=entry.id;
    c.onclick=()=>openDetail(entry);

    // 이미지 영역
    const imgWrap=document.createElement('div'); imgWrap.className='gcell-img';
    if(entry.cover){
      const img=document.createElement('img'); img.src=entry.cover; img.loading='lazy'; img.alt='';
      imgWrap.appendChild(img);
    }else{
      const ni=document.createElement('div'); ni.className='noimg';
      ni.innerHTML=`<div class="noimg-ico">💕</div>`;
      imgWrap.appendChild(ni);
    }
    c.appendChild(imgWrap);

    // 텍스트 영역
    const txt=document.createElement('div'); txt.className='gcell-txt';
    txt.innerHTML=`<div class="gcell-date">${escHtml(entry.date||'')}</div>
      <div class="gcell-day">${escHtml(entry.day||'기록')}</div>
      ${entry.memo?`<div class="gcell-memo">${escHtml(entry.memo)}</div>`:''}`;
    c.appendChild(txt);
    grid.appendChild(c);
  });

  if(shown.length===0&&allEntries.length>0)
    grid.innerHTML='<div style="grid-column:1/-1;padding:40px;text-align:center;color:var(--mute);font-size:13px">🔍 해당 조건의 기록이 없어요</div>';

// ── 캘린더 ──────────────────────────────────────────────
let calYear=new Date().getFullYear(), calMonth=new Date().getMonth(), calSel=null;
const MONTH_KO=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];

function calMove(dir){
  calMonth+=dir;
  if(calMonth>11){calMonth=0;calYear++;}
  if(calMonth<0){calMonth=11;calYear--;}
  calSel=null;
  renderCalendar();
}

function renderCalendar(){
  document.getElementById('cal-title').textContent=`${calYear}년 ${MONTH_KO[calMonth]}`;

  // 날짜→항목 맵 (allEntries 기반)
  const map={};
  allEntries.forEach(e=>{
    if(e.date){ if(!map[e.date]) map[e.date]=[]; map[e.date].push(e); }
  });

  const grid=document.getElementById('cal-days');
  grid.innerHTML='';
  const firstDow=new Date(calYear,calMonth,1).getDay(); // 0=Sun
  const lastDate=new Date(calYear,calMonth+1,0).getDate();
  const todayStr=new Date().toISOString().split('T')[0];

  // 빈 칸 (이전 달)
  for(let i=0;i<firstDow;i++){
    const c=document.createElement('div'); c.className='cal-day'; grid.appendChild(c);
  }

  for(let d=1;d<=lastDate;d++){
    const ds=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const c=document.createElement('div'); c.className='cal-day';
    const hasE=map[ds]?.length>0;
    if(ds===todayStr) c.classList.add('today');
    if(hasE) c.classList.add('has');
    if(ds===calSel) c.classList.add('sel');
    c.innerHTML=`<span class="dn">${d}</span>${hasE?'<span class="dot"></span>':''}`;
    if(hasE||true) c.onclick=()=>selectCalDate(ds,map[ds]||[]);
    grid.appendChild(c);
  }

  // 선택된 날짜 항목 표시
  if(calSel) renderCalEntries(calSel,map[calSel]||[]);
  else document.getElementById('cal-entries').innerHTML='';
}

function selectCalDate(ds,entries){
  calSel=ds; renderCalendar();
  renderCalEntries(ds,entries);
}

function renderCalEntries(ds,entries){
  const wrap=document.getElementById('cal-entries');
  if(!entries.length){
    wrap.innerHTML=`<div class="cal-empty">📅 ${ds}<br>기록이 없어요</div>`;
    return;
  }
  wrap.innerHTML=`<div style="font-size:12px;color:var(--mute);margin-bottom:8px;padding:0 2px">📅 ${ds} — ${entries.length}개 기록</div>`
    +entries.map((e,i)=>`
    <div class="cal-entry" onclick="openDetail(allEntries.find(x=>x.id==='${e.id}'))">
      <div class="cal-entry-thumb">${e.cover?`<img src="${e.cover}" alt="" loading="lazy">`:'💕'}</div>
      <div class="cal-entry-info">
        <div class="cal-entry-day">${escHtml(e.day||'제목 없음')}</div>
        ${e.memo?`<div class="cal-entry-memo">${escHtml(e.memo)}</div>`:''}
        <div class="cal-entry-tags">${(e.tags||[]).map(t=>`<span class="cal-entry-tag">${escHtml(t)}</span>`).join('')}</div>
      </div>
    </div>`).join('');
}

function openDetail(e){
  currentEntry=e; editSelCat=e.cat||null; editSelTags=[...(e.tags||[])]; editCoverUrl=null;
  renderGallery(e.cover?[{type:'image',url:e.cover}]:[]);
  document.getElementById('det-meta').textContent=`${e.date||''}${e.cat?' · '+e.cat:''}`;

  closeEditMode(); closeMoreMenu();

  loadPageBlocks(e.id);

async function loadPageBlocks(pageId){
  try{
    const res=await api(`/page-blocks?id=${pageId}`);
    if(res.media&&res.media.length>0){ currentGallery=res.media; renderGallery(res.media); }
    else currentGallery=currentEntry?.cover?[{type:'image',url:currentEntry.cover}]:[];
  }catch(_){}
}

function renderGallery(media){
  currentGallery=media;
  const scroll=document.getElementById('det-gallery-scroll');
  const dots=document.getElementById('det-dots');
  scroll.innerHTML=''; dots.innerHTML='';

  if(!media||media.length===0){
    scroll.innerHTML='<div class="det-gallery-slide"><div class="no-media">💕</div></div>';
    return;
  }
  media.forEach((m,i)=>{
    const slide=document.createElement('div'); slide.className='det-gallery-slide';
    if(m.type==='video'||/\.(mp4|mov|webm)/i.test(m.url||'')){
      const v=document.createElement('video');
      v.src=m.url; v.controls=true; v.playsInline=true;
      v.style.cssText='max-width:100%;max-height:100%;';
      slide.appendChild(v);
    }else{
      const img=document.createElement('img');
      img.src=m.url; img.alt=''; img.loading='lazy';
      slide.appendChild(img);
      // 확대 버튼
      const exp=document.createElement('button');
      exp.className='slide-expand'; exp.textContent='⤢';
      exp.onclick=ev=>{ev.stopPropagation();openImageViewer(m.url);};
      slide.appendChild(exp);
    }
    scroll.appendChild(slide);
    if(media.length>1){
      const dot=document.createElement('div');
      dot.className='det-dot'+(i===0?' on':'');
      dots.appendChild(dot);
    }
  });
  if(media.length>1){
    scroll.onscroll=()=>{
      const idx=Math.round(scroll.scrollLeft/scroll.clientWidth);
      dots.querySelectorAll('.det-dot').forEach((d,i)=>d.className='det-dot'+(i===idx?' on':''));
    };
  }
}

async function saveEdit(){
  // 폼 내부 에러 표시 헬퍼
  function showEditErr(msg){
    let el=document.getElementById('edit-err-msg');
    if(!el){
      el=document.createElement('div');
      el.id='edit-err-msg';
      el.style.cssText='padding:10px 12px;background:#FFEBEE;color:#C62828;border-radius:8px;font-size:13px;margin-bottom:12px;';
      const form=document.getElementById('det-edit-form');
      if(form) form.insertBefore(el,form.firstChild);
    }
    el.textContent=msg; el.style.display='block';
  }
  function hideEditErr(){
    const el=document.getElementById('edit-err-msg');
    if(el) el.style.display='none';
  }

  try{
    hideEditErr();
    const e=currentEntry;
    if(!e){ showEditErr('항목 정보가 없어요. 다시 열어주세요.'); return; }

    const day=(document.getElementById('edit-day')?.value||'').trim();
    const memo=(document.getElementById('edit-memo')?.value||'').trim();
    const btn=document.querySelector('.det-save-btn');

    if(btn){ btn.disabled=true; btn.textContent='저장 중...'; }

    try{
      const res=await api('/entry','PATCH',{
        pageId:e.id, day, memo,
        구분:editSelCat, 태그:editSelTags,
        coverUrl:editCoverUrl||null,
        titleProp, checkboxProp,
      });
      if(res.error) throw new Error(res.error);

      // 로컬 데이터 업데이트
      e.day=day; e.memo=memo; e.cat=editSelCat; e.tags=editSelTags;
      if(editCoverUrl) e.cover=editCoverUrl;

      const dDay=document.getElementById('det-day');
      const dMemo=document.getElementById('det-memo');
      const dMeta=document.getElementById('det-meta');
      const dTags=document.getElementById('det-tags');
      if(dDay)  dDay.textContent=day||'제목 없음';
      if(dMemo) dMemo.textContent=memo||'';
      if(dMeta) dMeta.textContent=`${e.date||''}${editSelCat?' · '+editSelCat:''}`;
      if(dTags) dTags.innerHTML=editSelTags.map(t=>`<span class="det-tag">${escHtml(t)}</span>`).join('');

      // 캐시 갱신
      writeCache(allEntries, false, null);

      closeEditMode();
      renderGrid(allEntries);
      showToast('✅ 수정 완료!');

    }catch(apiErr){
      console.error('[saveEdit api]', apiErr);
      showEditErr('❌ 저장 실패: ' + apiErr.message + '\n(Worker가 재배포됐는지 확인해주세요)');
    }finally{
      if(btn){ btn.disabled=false; btn.textContent='💾 저장'; }
    }
  }catch(outerErr){
    console.error('[saveEdit outer]', outerErr);
    // 폼이 없을 경우 알림으로라도 표시
    alert('오류 발생: ' + outerErr.message);
  }
}

// ── 풀스크린 이미지 뷰어 (핀치 줌) ───────────────────────
let vScale=1, vStartDist=0, vStartScale=1, vTx=0, vTy=0, vSx=0, vSy=0, vDragging=false;

function openImageViewer(url){
  const img=document.getElementById('img-viewer-img');
  img.src=url; vScale=1; vTx=0; vTy=0;
  img.style.transform='scale(1) translate(0,0)';
  document.getElementById('img-viewer').classList.add('on');
  initViewerGestures();
}
function closeImageViewer(){
  document.getElementById('img-viewer').classList.remove('on');
}

function initViewerGestures(){
  const wrap=document.getElementById('img-viewer-wrap');
  const img=document.getElementById('img-viewer-img');
  let lastTap=0, pinching=false;

  function clampTranslate(){
    if(vScale<=1){vTx=0;vTy=0;return;}
    const maxX=(img.naturalWidth||wrap.clientWidth)*(vScale-1)/2;
    const maxY=(img.naturalHeight||wrap.clientHeight)*(vScale-1)/2;
    vTx=Math.max(-maxX,Math.min(maxX,vTx));
    vTy=Math.max(-maxY,Math.min(maxY,vTy));
  }

  function applyTransform(){
    img.style.transform=`translate(${vTx}px,${vTy}px) scale(${vScale})`;
  }

  wrap.ontouchstart=e=>{
    if(e.touches.length===2){
      pinching=true;
      vStartDist=Math.hypot(
        e.touches[0].clientX-e.touches[1].clientX,
        e.touches[0].clientY-e.touches[1].clientY);
      vStartScale=vScale;
      e.preventDefault();
    } else if(e.touches.length===1&&!pinching){
      vSx=e.touches[0].clientX-vTx;
      vSy=e.touches[0].clientY-vTy;
      vDragging=true;
      const now=Date.now();
      if(now-lastTap<280){vScale=1;vTx=0;vTy=0;applyTransform();}
      lastTap=now;
      e.preventDefault();
    }
  };

  wrap.ontouchmove=e=>{
    if(e.touches.length===2&&pinching){
      const dist=Math.hypot(
        e.touches[0].clientX-e.touches[1].clientX,
        e.touches[0].clientY-e.touches[1].clientY);
      // 감도 조절: 0.9 dampening
      const rawScale=vStartScale*(dist/vStartDist);
      vScale=vScale*0.7+rawScale*0.3; // 부드럽게
      vScale=Math.min(5,Math.max(1,vScale));
      clampTranslate(); applyTransform(); e.preventDefault();
    } else if(e.touches.length===1&&vDragging&&vScale>1.05){
      const rawTx=e.touches[0].clientX-vSx;
      const rawTy=e.touches[0].clientY-vSy;
      // 드래그 감도 0.85
      vTx=vTx*0.15+rawTx*0.85;
      vTy=vTy*0.15+rawTy*0.85;
      clampTranslate(); applyTransform(); e.preventDefault();
    }
  };

  wrap.ontouchend=e=>{
    if(e.touches.length<2) pinching=false;
    vDragging=false;
    if(vScale<1.1){vScale=1;vTx=0;vTy=0;}
    clampTranslate(); applyTransform();
  };
}

// ── 수정 모드 사진 추가 ─────────────────────────────────────
async function onEditFileSelect(e){
  const files=Array.from(e.target.files); e.target.value='';
  if(!files.length||!currentEntry) return;

  const statusEl=document.getElementById('edit-upload-status');
  statusEl.style.display='block';
  statusEl.style.background='#F5F5F5'; statusEl.style.color='#666';
  statusEl.textContent=`📤 ${files.length}개 업로드 중...`;

  try{
    const uploaded=await Promise.all(files.map(async f=>{
      const form=new FormData(); form.append('file',f,f.name);
      return await apiFd('/upload',form);
    }));
    const media=uploaded.map(r=>({url:r.url,mediaType:r.mediaType}));

    await api('/append-blocks','POST',{pageId:currentEntry.id,media});

    // 갤러리 업데이트
    currentGallery=[...currentGallery,...media.map(m=>({type:m.mediaType,url:m.url}))];
    renderGallery(currentGallery);

    // 커버 선택 칸에 새 사진 추가
    const cr=document.getElementById('cover-select-row');
    if(cr){
      media.filter(m=>m.mediaType!=='video').forEach(m=>{
        const th=document.createElement('div');
        th.className='cover-thumb'; th.dataset.url=m.url;
        th.innerHTML=`<img src="${m.url}" alt="">`;
        th.onclick=()=>{
          editCoverUrl=m.url;
          cr.querySelectorAll('.cover-thumb').forEach(t=>t.classList.remove('selected'));
          th.classList.add('selected');
        };
        cr.appendChild(th);
      });
    }

    statusEl.style.background='#E8F5E9'; statusEl.style.color='#2E7D32';
    statusEl.textContent=`✅ ${files.length}개 추가됐어요`;
    setTimeout(()=>statusEl.style.display='none',3000);
  }catch(err){
    statusEl.style.background='#FFEBEE'; statusEl.style.color='#C62828';
    statusEl.textContent='❌ 업로드 실패: '+err.message;
  }
}

// ── 로그인 ─────────────────────────────────────────────
function showLoginScreen(){
  document.getElementById('login-screen').style.display='flex';
  document.getElementById('login-err').style.display='none';
  setTimeout(()=>document.getElementById('login-pw')?.focus(),100);
}
async function tryLogin(){
  const pw=document.getElementById('login-pw').value.trim();
  if(!pw) return;
  const btn=document.querySelector('.login-btn');
  btn.textContent='확인 중...'; btn.disabled=true;
  try{
    const res=await fetch(WORKER+'/options',{
      headers:{'X-Secret-Key':pw,'Content-Type':'application/json'}
    });
    const data=await res.json();
    if(res.status===401||data.error==='Unauthorized'){
      document.getElementById('login-err').style.display='block';
      document.getElementById('login-pw').value='';
    } else {
      SECRET=pw;
      localStorage.setItem('ll_secret',pw);
      document.getElementById('login-screen').style.display='none';
      initApp();
    }
  }catch(e){
    document.getElementById('login-err').textContent='❌ 연결 실패 — Worker URL을 확인해주세요';
    document.getElementById('login-err').style.display='block';
  }finally{
    btn.textContent='입장 💕'; btn.disabled=false;
  }
}
function logout(){
  if(!confirm('로그아웃 하면 이 기기에서 비밀번호가 초기화돼요.')) return;
  localStorage.removeItem('ll_secret');
  SECRET='';
  closeSettings();
  showLoginScreen();
}
function openWrite(){
  document.getElementById('date-input').value=new Date().toISOString().split('T')[0];
  showSheet('write-ov','write-sh'); onDateChange();
}
function closeWrite(){hideSheet('write-ov','write-sh');}

// ── 공유 파일 ──────────────────────────────────────────
async function loadSharedFiles(){
  try{
    const cache=await caches.open(SHARE_CACHE);

    // SW가 파일 저장 완료할 때까지 최대 5초 폴링
    let ready=false;
    for(let i=0;i<50;i++){
      const r=await cache.match('/lovelog/shared-ready').catch(()=>null);
      if(r){ ready=true; break; }
      await new Promise(res=>setTimeout(res,100));
    }
    if(!ready){ showToast('📷 사진을 불러오지 못했어요 (다시 시도해주세요)'); return; }

    const mr=await cache.match('/lovelog/shared-meta'); if(!mr) return;
    const meta=await mr.json();
    for(const item of meta){
      const r=await cache.match(item.cacheKey); if(!r) continue;
      const blob=new Blob([await r.arrayBuffer()],{type:item.type});
      addMedia(blob,item.name);
    }
    const keys=await cache.keys(); await Promise.all(keys.map(k=>cache.delete(k)));
    showToast(`📸 ${meta.length}개 사진 불러왔어요`);
  }catch(e){console.error('[Share]',e); showToast('❌ 사진 불러오기 실패');}
}

// ── 미디어 ─────────────────────────────────────────────
function addMedia(blob,name){
  mediaItems.push({blob,url:URL.createObjectURL(blob),type:blob.type?.startsWith('video/')?'video':'image',name:name||'media'});
  renderStrip();
}
function renderStrip(){
  const s=document.getElementById('mstrip'); if(!s) return; s.innerHTML='';
  mediaItems.forEach((item,i)=>{
    const w=document.createElement('div'); w.className='mi'+(i===0?' main':'');
    w.addEventListener('click',()=>setMain(i));
    if(item.type==='video'){
      const v=document.createElement('video');v.src=item.url;v.muted=true;v.playsInline=true;w.appendChild(v);
      const b=document.createElement('div');b.className='mi-vb';b.textContent='▶';w.appendChild(b);
    }else{
      const img=document.createElement('img');img.src=item.url;img.loading='lazy';w.appendChild(img);
    }
    if(i===0){const b=document.createElement('div');b.className='mi-mb';b.textContent='대표';w.appendChild(b);}
    const rm=document.createElement('button');rm.className='mi-rm';rm.textContent='×';
    rm.addEventListener('click',e=>{e.stopPropagation();removeMedia(i);});
    w.appendChild(rm); s.appendChild(w);
  });
  const l=document.createElement('label');l.className='madd';l.htmlFor='file-input';
  l.innerHTML='<span class="pl">＋</span><span>추가</span>';
  s.appendChild(l);
}
function setMain(idx){if(idx===0)return;const[i]=mediaItems.splice(idx,1);mediaItems.unshift(i);renderStrip();}
function removeMedia(idx){URL.revokeObjectURL(mediaItems[idx].url);mediaItems.splice(idx,1);renderStrip();}
function onFileSelect(e){Array.from(e.target.files).forEach(f=>addMedia(f,f.name));e.target.value='';}

async function testWorker(){
  const w=document.getElementById('set-worker').value.trim().replace(/\/$/,'');
  const st=document.getElementById('worker-status');
  if(!w){st.style.display='block';st.style.background='#FFF8E1';st.style.color='#E65100';st.textContent='⚠️ URL을 먼저 입력해주세요';return;}
  st.style.display='block';st.style.background='#F5F5F5';st.style.color='#888';st.textContent='🔄 연결 확인 중...';
  try{
    const res=await fetch(w+'/options',{method:'GET',headers:{'X-Secret-Key':SECRET,'Content-Type':'application/json'}});
    const data=await res.json();
    if(res.status===401){st.style.background='#FFF8E1';st.style.color='#E65100';st.textContent='⚠️ 인증 실패 — SECRET_KEY 값을 확인해주세요';}
    else if(data.구분!==undefined){st.style.background='#E8F5E9';st.style.color='#2E7D32';st.textContent='✅ 연결 성공! Worker 정상 동작 중';}
    else{st.style.background='#FFF8E1';st.style.color='#E65100';st.textContent='⚠️ 응답은 왔지만 형식이 달라요: '+JSON.stringify(data).slice(0,60);}
  }catch(e){
    st.style.background='#FFEBEE';st.style.color='#C62828';
    st.textContent='❌ 연결 실패 — URL 확인 또는 CORS 문제: '+e.message;
  }
}

// ── 옵션 ───────────────────────────────────────────────
async function loadOptions(){
  try{
    const res=await api('/options');
    titleProp=res._meta?.titleProp||'이름'; checkboxProp=res._meta?.checkboxProp||'체크';
    const ce=document.getElementById('cat-chips'); ce.innerHTML='';
    (res.구분||[]).forEach(o=>{const c=mkChip(o.name,()=>toggleCat(o.name,c));ce.appendChild(c);});
    const te=document.getElementById('tag-chips'); te.innerHTML='';
    (res.태그||[]).forEach(o=>{allTags.push(o.name);const c=mkChip(o.name,()=>toggleTag(o.name,c));te.appendChild(c);});
  }catch(e){
    const errHtml='<span style="font-size:12px;color:#E53935">⚠️ 로드 실패 — ≡ 메뉴에서 Worker URL 확인</span>';
    const ce=document.getElementById('cat-chips'); if(ce) ce.innerHTML=errHtml;
    const te=document.getElementById('tag-chips'); if(te) te.innerHTML='';
    console.error('[loadOptions]',e);
  }
}
function mkChip(text,cb){const c=document.createElement('div');c.className='chip';c.textContent=text;c.addEventListener('click',cb);return c;}
function toggleCat(name,chip){document.querySelectorAll('#cat-chips .chip').forEach(c=>c.classList.remove('on'));selCat=selCat===name?null:name;if(selCat)chip.classList.add('on');}
function toggleTag(name,chip){const i=selTags.indexOf(name);if(i===-1){selTags.push(name);chip.classList.add('on');}else{selTags.splice(i,1);chip.classList.remove('on');}}

// ── 날짜 체크 ──────────────────────────────────────────
function onDateChange(){clearTimeout(dateTimer);dateTimer=setTimeout(checkDate,600);}
async function checkDate(){
  const date=document.getElementById('date-input')?.value; if(!date) return;
  lovelogId=null;
  const badge=document.getElementById('mbdg'); if(!badge) return;
  badge.style.display='flex';
  try{
    const res=await api(`/check-date?date=${date}`);
    if(res.lovelogMatch){
      lovelogId=res.lovelogMatch.id; badge.className='mbdg hit';
      document.getElementById('mtext').textContent=`❤️ ${res.lovelogMatch.title} 연결됨`;
    }else{
      badge.className='mbdg miss';
      document.getElementById('mtext').textContent='💔 LOVE LOG 매칭 없음';
    }
    const dw=document.getElementById('dup-warn');
    if(res.existing?.length){
      dw.innerHTML=`<div class="dw"><div class="dw-hd">⚠️ ${date}에 이미 ${res.existing.length}개 항목 있음 (추가 가능)</div>${
        res.existing.map(it=>`<div class="dw-it"><div class="dw-th">${it.cover?`<img src="${it.cover}" alt="">`:'📅'}</div><div class="dw-info"><div class="dw-day">${escHtml(it.day||'제목 없음')}</div><div class="dw-memo">${escHtml(it.memo||'')}</div></div></div>`).join('')}</div>`;
    }else{dw.innerHTML='';}
  }catch(e){badge.className='mbdg miss';document.getElementById('mtext').textContent='확인 실패';}
}

// ── 등록 ───────────────────────────────────────────────
async function submitEntry(){
  const date=document.getElementById('date-input').value;
  const day=document.getElementById('day-input').value.trim();
  const memoT=(document.getElementById('memo-title')?.value||'').trim();
  const memoB=(document.getElementById('memo-body')?.value||'').trim();
  const memo=memoT&&memoB?`${memoT}\n${memoB}`:memoT||memoB;
  const chk=document.getElementById('check-input').checked;

  if(!date){showToast('날짜를 선택해주세요');return;}
  if(!day&&mediaItems.length===0){showToast('Day 또는 사진을 입력해주세요');return;}

  // 날짜 체크 진행중이면 완료 대기 (최대 1.5초)
  if(dateTimer){
    clearTimeout(dateTimer);
    await checkDate();
  }

  const btn=document.getElementById('submit-btn');
  btn.disabled=true;
  showLoading('업로드 중...');
  try{
    // 순차 업로드 (진행률 정확하게)
    const uploaded=[];
    for(let i=0;i<mediaItems.length;i++){
      setLoadMsg(`사진 업로드 중... (${i+1}/${mediaItems.length})`);
      setProgress(10+Math.round(((i)/Math.max(mediaItems.length,1))*55));
      const form=new FormData();
      form.append('file',mediaItems[i].blob,mediaItems[i].name);
      try{
        const r=await apiFd('/upload',form);
        uploaded.push({url:r.url,mediaType:r.mediaType});
      }catch(uploadErr){
        showToast(`⚠️ ${i+1}번째 파일 업로드 실패 — 건너뜀`);
        console.warn('[upload skip]',uploadErr);
      }
    }

    setProgress(70); setLoadMsg('노션에 저장 중...');

    const result=await api('/entry','POST',{
      date, day, memo,
      구분:selCat, 태그:selTags,
      checked:chk, lovelogId,
      media:uploaded,
      titleProp, checkboxProp,
    });

    setProgress(100);

    if(result.success){
      showToast('✅ 등록 완료!');
      if('vibrate'in navigator)navigator.vibrate([30,50,30]);

      // 새 항목 즉시 그리드 맨 위에 반영 (낙관적 업데이트)
      const newEntry={
        id: result.pageId||'tmp_'+Date.now(),
        date, day, memo,
        cat: selCat||'', tags: selTags,
        cover: result.cover||uploaded.find(u=>u.mediaType==='image')?.url||null,
      };
      allEntries.unshift(newEntry);
      renderGrid(allEntries);
      clearCache();

      resetForm(); closeWrite();
      // 백그라운드에서 실제 데이터 재로드
      setTimeout(()=>loadGrid(true),2000);
    }else{
      showToast('❌ 등록 실패: '+(result.error||'알 수 없는 오류'));
    }
  }catch(e){
    showToast('❌ '+e.message);
    console.error('[submitEntry]',e);
  }finally{
    hideLoading();
    btn.disabled=false;
  }
}
function resetForm(){
  mediaItems.forEach(m=>URL.revokeObjectURL(m.url)); mediaItems=[];selCat=null;selTags=[];
  renderStrip();
  ['day-input','memo-title','memo-body'].forEach(id=>{const el=document.getElementById(id);if(el)el.value='';});
  document.getElementById('check-input').checked=false;
  document.querySelectorAll('#write-sh .chip.on').forEach(c=>c.classList.remove('on'));
  document.getElementById('date-input').value=new Date().toISOString().split('T')[0];
}

// ── 네비/시트 헬퍼 ─────────────────────────────────────
function nbClick(el){document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));el.classList.add('on');}
function showSheet(ovId,shId){document.getElementById(ovId).classList.add('on');document.getElementById(shId).classList.add('on');document.body.style.overflow='hidden';}
function hideSheet(ovId,shId){document.getElementById(ovId).classList.remove('on');document.getElementById(shId).classList.remove('on');document.body.style.overflow='';}

// ── API ─────────────────────────────────────────────────
async function api(path,method='GET',body=null){
  const opts={method,headers:{'X-Secret-Key':SECRET,'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  const res=await fetch(WORKER+path,opts); const data=await res.json();
  if(data.error) throw new Error(data.error); return data;
}
async function apiFd(path,fd){
  const res=await fetch(WORKER+path,{method:'POST',headers:{'X-Secret-Key':SECRET},body:fd});
  const data=await res.json(); if(data.error) throw new Error(data.error); return data;
}

function showLoading(m){document.getElementById('loading-msg').textContent=m;document.getElementById('prog-fill').style.width='0';document.getElementById('loading').classList.add('on');}
function setLoadMsg(t){document.getElementById('loading-msg').textContent=t;}
function setProgress(p){document.getElementById('prog-fill').style.width=p+'%';}
function hideLoading(){document.getElementById('loading').classList.remove('on');}
let _tt;
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('on');clearTimeout(_tt);_tt=setTimeout(()=>el.classList.remove('on'),5000);}
function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
